name: deploy
# A push to main builds the site and puts it live; functions and Firestore
# rules are only deployed by a run started by hand, since they take payments.
# A push to any other branch deploys the site to a preview channel of its own,
# which expires after a week, and the job summary links it.
#
# Run by hand from the Actions tab:
# deploy            builds `ref` and deploys the selected targets in a safe order:
#                   functions, then Firestore rules, then hosting.
#                   To roll everything back, run it with an earlier deployment's commit.
# rollback-hosting  re-releases the previous live hosting version without rebuilding;
#                   the fastest way back from a bad site release.
#
# Live runs are recorded against the `production` environment, so its history
# lists which commit is live. No key is stored: GitHub's token is exchanged
# through the project's Workload Identity pool for the deploy service account.
'on':
  push:
    branches: ['**']
  workflow_dispatch:
    inputs:
      action:
        type: choice
        options: [deploy, rollback-hosting]
        default: deploy
      ref:
        description: Commit, tag or branch to deploy
        default: main
      functions:
        description: Deploy Cloud Functions
        type: boolean
        default: true
      rules:
        description: Deploy Firestore rules
        type: boolean
        default: true
      hosting:
        description: Deploy the site
        type: boolean
        default: true

permissions:
  contents: read
  id-token: write

# Live deploys queue behind one another; each preview channel queues on its own.
concurrency:
  group: deploy-${{ (github.event_name == 'workflow_dispatch' || github.ref_name == 'main') && 'production' || github.ref_name }}
  cancel-in-progress: false

env:
  PROJECT_ID: puugpersonalwebru
  FIREBASE_TOOLS: firebase-tools@15.32.1
  NEXT_PUBLIC_FIREBASE_API_KEY: ${{ vars.NEXT_PUBLIC_FIREBASE_API_KEY }}
  NEXT_PUBLIC_FIREBASE_AUTH_DOMAIN: puugpersonalwebru.web.app
  NEXT_PUBLIC_FIREBASE_PROJECT_ID: puugpersonalwebru
  NEXT_PUBLIC_STRIPE_PUBLIC_KEY: ${{ vars.NEXT_PUBLIC_STRIPE_PUBLIC_KEY }}

jobs:
  preview:
    if: github.event_name == 'push' && github.ref_name != 'main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
      - run: npm ci && npm run build
      - uses: google-github-actions/auth@v3
        with:
          workload_identity_provider: ${{ vars.WIF_PROVIDER }}
          service_account: ${{ vars.WIF_SERVICE_ACCOUNT }}
      # Channel ids take only lower-case letters, digits and hyphens.
      - run: |
          channel=$(echo "$GITHUB_REF_NAME" | tr '[:upper:]' '[:lower:]' | sed 's/[^a-z0-9-]/-/g' | cut -c1-30)
          npx --yes "$FIREBASE_TOOLS" hosting:channel:deploy "$channel" --expires 7d \
            --project "$PROJECT_ID" --non-interactive --json > channel.json
          url=$(jq -r '.result[].url' channel.json)
          echo "Preview of \`$GITHUB_REF_NAME\`: $url" >> "$GITHUB_STEP_SUMMARY"

  deploy:
    if: (github.event_name == 'push' && github.ref_name == 'main') || inputs.action == 'deploy'
    runs-on: ubuntu-latest
    environment: production
    env:
      # A push to main deploys only the site.
      FUNCTIONS: ${{ github.event_name == 'workflow_dispatch' && inputs.functions }}
      RULES: ${{ github.event_name == 'workflow_dispatch' && inputs.rules }}
      HOSTING: ${{ github.event_name == 'push' || inputs.hosting }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.ref || github.sha }}
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
      # Build before deploying anything, so a broken build changes nothing.
      - if: env.HOSTING == 'true'
        run: npm ci && npm run build
      - uses: google-github-actions/auth@v3
        with:
          workload_identity_provider: ${{ vars.WIF_PROVIDER }}
          service_account: ${{ vars.WIF_SERVICE_ACCOUNT }}
      - if: env.FUNCTIONS == 'true'
        run: |
          npm ci --prefix functions
          npx --yes "$FIREBASE_TOOLS" deploy --only functions --project "$PROJECT_ID" --non-interactive
      - if: env.RULES == 'true'
        run: npx --yes "$FIREBASE_TOOLS" deploy --only firestore:rules --project "$PROJECT_ID" --non-interactive
      # Names the commit checked out, which differs from github.sha when `ref` is an earlier one.
      - if: env.HOSTING == 'true'
        run: |
          sha=$(git rev-parse --short HEAD)
          npx --yes "$FIREBASE_TOOLS" deploy --only hosting --project "$PROJECT_ID" \
            --non-interactive --message "$sha via run $GITHUB_RUN_ID"
          echo "Live: https://puugpersonalwebru.web.app at $sha" >> "$GITHUB_STEP_SUMMARY"

  rollback-hosting:
    if: inputs.action == 'rollback-hosting'
    runs-on: ubuntu-latest
    environment: production
    steps:
      - id: auth
        uses: google-github-actions/auth@v3
        with:
          workload_identity_provider: ${{ vars.WIF_PROVIDER }}
          service_account: ${{ vars.WIF_SERVICE_ACCOUNT }}
          token_format: access_token
      # Same as "Rollback" in the Firebase console: release the newest earlier
      # version that differs from what's live now.
      - env:
          TOKEN: ${{ steps.auth.outputs.access_token }}
        run: |
          api=https://firebasehosting.googleapis.com/v1beta1/sites/$PROJECT_ID/channels/live/releases
          releases=$(curl -sf -H "Authorization: Bearer $TOKEN" "$api?pageSize=20")
          current=$(jq -r '.releases[0].version.name' <<<"$releases")
          previous=$(jq -r --arg cur "$current" \
            '[.releases[] | select(.version.name != $cur and .version.status == "FINALIZED")][0].version.name // empty' <<<"$releases")
          [ -n "$previous" ] || { echo "::error::no earlier version to roll back to"; exit 1; }
          echo "rolling back from $current to $previous"
          curl -sf -X POST -H "Authorization: Bearer $TOKEN" -H "Content-Type: application/json" \
            -d '{"message":"rollback via run ${{ github.run_id }}"}' "$api?versionName=$previous" >/dev/null
          echo "Rolled back hosting to \`$previous\`" >> "$GITHUB_STEP_SUMMARY"
