name: Deploy branch preview to Firebase Hosting
'on':
  push:
    branches-ignore:
      - main
permissions:
  contents: read
  id-token: write
jobs:
  build_and_preview:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
      - run: npm ci && npm run build
        env:
          NEXT_PUBLIC_FIREBASE_API_KEY: ${{ vars.NEXT_PUBLIC_FIREBASE_API_KEY }}
          NEXT_PUBLIC_FIREBASE_AUTH_DOMAIN: puugpersonalwebru.web.app
          NEXT_PUBLIC_FIREBASE_PROJECT_ID: puugpersonalwebru
          NEXT_PUBLIC_STRIPE_PUBLIC_KEY: ${{ vars.NEXT_PUBLIC_STRIPE_PUBLIC_KEY }}
      - uses: google-github-actions/auth@v3
        with:
          workload_identity_provider: ${{ vars.WIF_PROVIDER }}
          service_account: ${{ vars.WIF_SERVICE_ACCOUNT }}
      # Firebase channel IDs only allow letters, numbers and hyphens
      - run: |
          channel=$(echo "$GITHUB_REF_NAME" | tr '[:upper:]' '[:lower:]' | sed 's/[^a-z0-9-]/-/g' | cut -c1-30)
          npx --yes firebase-tools@15 hosting:channel:deploy "$channel" --expires 7d \
            --project puugpersonalwebru --non-interactive --json > deploy.json
          url=$(jq -r '.result | to_entries[0].value.url' deploy.json)
          echo "Preview: $url" | tee -a "$GITHUB_STEP_SUMMARY"
