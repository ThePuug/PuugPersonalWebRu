name: Deploy branch preview to Firebase Hosting
'on':
  push:
    branches-ignore:
      - main
jobs:
  build_and_preview:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
      - run: npm ci && npm run build
        env:
          NEXT_PUBLIC_FIREBASE_API_KEY: '${{ secrets.GATSBY_FIREBASE_API_KEY }}'
          NEXT_PUBLIC_FIREBASE_AUTH_DOMAIN: 'puugpersonalwebru.web.app'
          NEXT_PUBLIC_FIREBASE_PROJECT_ID: 'puugpersonalwebru'
          # Stripe publishable keys are public by design (they ship in the JS bundle).
          # Hardcoded so the key visibly matches the account behind functions.config().stripe.privatekey;
          # the GATSBY_STRIPE_PUBLIC_KEY repo secret previously held a different account's key, which
          # broke confirmCardPayment (cross-account client_secret) in production.
          NEXT_PUBLIC_STRIPE_PUBLIC_KEY: 'pk_test_51JC43BFkjIptzemw0PYYae6SUI7Z49QtmlXMTzbcIrZ0iIQUVmycn6MhHR5uJ6AtXbzCnwuYJrKCtCQjkWDbFgxz00eUVN954d'
      # Firebase channel IDs only allow letters, numbers and hyphens
      - id: channel
        run: echo "id=$(echo "$GITHUB_REF_NAME" | tr '[:upper:]' '[:lower:]' | sed 's/[^a-z0-9-]/-/g' | cut -c1-30)" >> "$GITHUB_OUTPUT"
      - uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          repoToken: '${{ secrets.GITHUB_TOKEN }}'
          firebaseServiceAccount: '${{ secrets.FIREBASE_SERVICE_ACCOUNT_PUUGPERSONALWEBRU }}'
          channelId: '${{ steps.channel.outputs.id }}'
          projectId: puugpersonalwebru
        env:
          FIREBASE_CLI_PREVIEWS: hostingchannels
